<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bakes - Order</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #8b4513;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #8b4513;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #6f350f;
    }

    .success {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🍰 Smart Bakes</h1>

    <form id="orderForm">

      <label>Customer Name</label>
      <input type="text" id="name" required>

      <label>Phone Number</label>
      <input type="tel" id="phone" required>

      <label>Select Item</label>
      <select id="item" required>
        <option value="">Choose an item</option>
        <option>Cake</option>
        <option>Black Forest Cake</option>
        <option>Red Velvet Cake</option>
        <option>Brownie</option>
        <option>Cookies</option>
        <option>Puffs</option>
      </select>

      <label>Quantity</label>
      <input type="number" id="quantity" min="1" value="1" required>

      <label>Delivery Address</label>
      <textarea id="address" rows="4" required></textarea>

      <button type="submit">Place Order 🍰</button>

    </form>

    <div class="success" id="successMessage">
      ✅ Order placed successfully!
    </div>

  </div>

  <script>
    document.getElementById("orderForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const item = document.getElementById("item").value;
      const quantity = document.getElementById("quantity").value;
      const address = document.getElementById("address").value;

      const message =
        "🍰 NEW ORDER - SMART BAKES%0A%0A" +
        "👤 Name: " + encodeURIComponent(name) + "%0A" +
        "📞 Phone: " + encodeURIComponent(phone) + "%0A" +
        "🍰 Item: " + encodeURIComponent(item) + "%0A" +
        "🔢 Quantity: " + encodeURIComponent(quantity) + "%0A" +
        "📍 Address: " + encodeURIComponent(address);

      /*
        IMPORTANT:
        Change 919876543210 below to your bakery
        WhatsApp number with country code.
      */

      const bakeryNumber = "919876543210";

      const whatsappURL =
        "https://wa.me/" + bakeryNumber + "?text=" + message;

      document.getElementById("successMessage").style.display = "block";

      setTimeout(function() {
        window.open(whatsappURL, "_blank");
      }, 500);

    });
  </script>

</body>
</html>
